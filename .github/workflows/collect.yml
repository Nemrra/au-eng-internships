name: collect
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch:
    inputs:
      discover:
        description: "Run ATS discovery for unresolved employers"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["collector/**", "tools/**", "registry/employers.json", ".github/workflows/collect.yml", "data/manual.json"]
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect listings
        run: |
          FLAGS=""
          # discovery: once a day (16:17 UTC = ~3am Melbourne), on manual request, or when collector code changes
          if [ "$(date -u +%H)" = "16" ] || [ "${{ inputs.discover }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then FLAGS="--discover"; fi
          python -m collector.run $FLAGS
      - name: Debug dump (temporary)
        if: github.event_name == 'push'
        run: python tools/debug_dump.py || true
      - name: Commit data
        run: |
          git config user.name "au-eng-internships-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data registry/discovered.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(jq -r '"\(.jobs_open) open, \(.new_today) new today, \(.sources_ok)/\(.sources_total) sources ok"' data/last_run.json)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
